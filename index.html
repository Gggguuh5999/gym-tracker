<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة العملاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F6;--surface:#fff;--ink:#18212B;--muted:#5C6975;--line:#DCE1E6;--field:#F7F8FA;--accent:#C8102E;--on-accent:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171D;--surface:#1A222B;--ink:#EDF0F3;--muted:#9BA8B5;--line:#2B3641;--field:#141B22;--accent:#FF5468;--on-accent:#11171D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11171D;--surface:#1A222B;--ink:#EDF0F3;--muted:#9BA8B5;--line:#2B3641;--field:#141B22;--accent:#FF5468;--on-accent:#11171D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.top h1{flex:1;min-width:0;margin:0;font-size:22px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{color:var(--muted);font-size:14px}
.wrap{max-width:560px;margin:0 auto;padding:4px 16px 40px}
input{font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:100%;min-height:48px}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;min-height:46px;padding:0 18px;background:var(--accent);color:var(--on-accent);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{color:var(--accent);width:100%;margin-top:28px}
.row{display:flex;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two input{font-size:24px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.client{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font:inherit;color:inherit;cursor:pointer}
.client:hover{border-color:var(--muted)}
.plate{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.3)}
.plate.sm{width:36px;height:36px;font-size:15px}
.info{display:flex;flex-direction:column;min-width:0}
.name{font-weight:600}
.sub{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.when{margin-inline-start:8px}
h2{font-size:17px;margin:22px 0 2px}
.hint{color:var(--muted);font-size:14px;margin:0}
.day{margin:18px 0 8px;color:var(--muted);font-size:14px;font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.ex b{display:block;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding-inline:14px 4px;font-weight:600;font-variant-numeric:tabular-nums}
.chip button{border:0;background:transparent;color:var(--muted);font:inherit;min-width:32px;height:32px;border-radius:999px;cursor:pointer}
.chip.arm{border-color:var(--accent)}
.chip.arm button{color:var(--accent);font-size:13px;padding:0 8px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;margin:0}
.warn{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.foot{margin-top:24px}
.foot .btn{flex:1}
.foot+.hint{margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY='gymlog.v1',db={clients:[]},storeOK=true,note='';
var inApp=/FBAN|FBAV|Instagram|WhatsApp|Telegram|Messenger|Line\/|; wv\)/i.test(navigator.userAgent);
try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){storeOK=false}
if(storeOK){try{var s=localStorage.getItem(KEY);if(s)db=JSON.parse(s);if(!db||!Array.isArray(db.clients))db={clients:[]}}catch(e){db={clients:[]}}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
function save(){if(!storeOK)return;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){storeOK=false}}
var view=null,q='',adding=false,armed=null,draft={ex:'',w:'',r:''};
var app=document.getElementById('app');
var $=function(x){return document.querySelector(x)};
var PL=[['#C8102E','#fff'],['#1D4ED8','#fff'],['#F2B705','#18212B'],['#1B8A4B','#fff'],['#CBD2D9','#18212B']];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function cur(){return db.clients.find(function(c){return c.id===view})}
function dkey(t){var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function diff(t){return Math.round((new Date(dkey(Date.now()))-new Date(dkey(t)))/864e5)}
function ago(t){var n=diff(t);return n<1?'النهارده':n===1?'امبارح':n===2?'من يومين':n<=10?'من '+n+' أيام':'من '+n+' يوم'}
function dlabel(t){var n=diff(t);if(n<1)return'النهارده';if(n===1)return'امبارح';try{return new Date(t).toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'long'})}catch(e){return dkey(t)}}
function plate(c,sm){var p=PL[c.pi%5];return'<span class="plate'+(sm?' sm':'')+'" aria-hidden="true" style="background:'+p[0]+';color:'+p[1]+'">'+esc(Array.from(c.name)[0])+'</span>'}

function warn(){
  var m=!storeOK?'الحفظ مش شغال بالطريقة اللي فتحت بيها الصفحة، فأي حاجة تسجّلها هتضيع لما تخرج. افتح اللينك من Chrome أو Safari، مش كملف ومش من جوه واتساب.':inApp?'إنت فاتح من جوه تطبيق، والمتصفح الداخلي ممكن يمسح الداتا. افتح اللينك من Chrome أو Safari.':'';
  return(m?'<div class="warn">'+m+'</div>':'')+(note?'<div class="warn">'+esc(note)+'</div>':'');
}
function paint(){var y=window.scrollY;view===null?pList():pClient();note='';window.scrollTo(0,y)}

function pList(){
  app.innerHTML='<header class="top"><h1>العملاء</h1><span class="count">'+db.clients.length+' عميل</span><button class="btn" data-act="toggle">'+(adding?'إلغاء':'عميل جديد')+'</button></header><main class="wrap">'+warn()
  +(adding?'<form class="card" data-form="addc"><label for="nn">اسم العميل</label><div class="row"><input id="nn" autocomplete="off" maxlength="40" required><button class="btn">إضافة</button></div></form>':'')
  +(db.clients.length?'<input id="q" type="search" placeholder="دوّر على عميل" aria-label="بحث" value="'+esc(q)+'">':'')
  +'<div id="cl"></div><div class="row foot"><button class="btn ghost" data-act="exp">نسخة احتياطية</button><button class="btn ghost" data-act="imp">استرجاع نسخة</button><input id="imp" type="file" accept="application/json,.json" hidden></div>'+(db.clients.length?'<p class="hint">الداتا محفوظة على الموبايل ده بس، فخد نسخة احتياطية كل فترة.</p>':'')+'</main>';
  fillList();
  if(adding)$('#nn').focus();
}
function fillList(){
  var t=q.trim().toLowerCase();
  var cs=db.clients.filter(function(c){return c.name.toLowerCase().includes(t)}).sort(function(a,b){return a.name.localeCompare(b.name,'ar')});
  $('#cl').innerHTML=cs.length?cs.map(function(c){
    var l=c.sets[c.sets.length-1];
    return'<button class="client" data-act="open" data-id="'+c.id+'">'+plate(c)+'<span class="info"><span class="name">'+esc(c.name)+'</span><span class="sub">'+(l?esc(l.ex)+' <bdi dir="ltr">'+l.w+' × '+l.r+'</bdi><span class="when">'+ago(l.t)+'</span>':'لسه مفيش تسجيل')+'</span></span></button>'
  }).join(''):'<p class="empty">'+(db.clients.length?'مفيش عميل بالاسم ده.':'لسه مفيش عملاء. دوس على «عميل جديد» وضيف أول واحد.')+'</p>';
}

function pClient(){
  var c=cur();if(!c){view=null;return pList()}
  var exs=[];db.clients.forEach(function(x){x.sets.forEach(function(s){if(exs.indexOf(s.ex)<0)exs.push(s.ex)})});
  var days=[];
  c.sets.slice().reverse().forEach(function(s){
    var k=dkey(s.t),d=days.find(function(x){return x.k===k});
    if(!d)days.push(d={k:k,t:s.t,ex:[]});
    var e=d.ex.find(function(x){return x.n===s.ex});
    if(!e)d.ex.push(e={n:s.ex,s:[]});
    e.s.unshift(s);
  });
  app.innerHTML='<header class="top"><button class="btn ghost" data-act="back">رجوع</button>'+plate(c,1)+'<h1>'+esc(c.name)+'</h1></header><main class="wrap">'+warn()
  +'<form class="card" data-form="addset"><div><label for="ex">التمرين</label><input id="ex" list="exl" autocomplete="off" maxlength="40" required value="'+esc(draft.ex)+'"><datalist id="exl">'+exs.map(function(e){return'<option value="'+esc(e)+'">'}).join('')+'</datalist></div>'
  +'<div class="two"><div><label for="w">الوزن (كجم)</label><input id="w" type="number" inputmode="decimal" step="any" min="0" required value="'+esc(draft.w)+'"></div>'
  +'<div><label for="r">العدّات</label><input id="r" type="number" inputmode="numeric" step="1" min="1" required value="'+esc(draft.r)+'"></div></div>'
  +'<button class="btn" id="sv">سجّل</button></form>'
  +'<h2>السجل</h2><p class="hint">الوزن × العدّات</p>'
  +(days.length?days.map(function(d){
    return'<div class="day">'+dlabel(d.t)+'</div>'+d.ex.map(function(e){
      return'<section class="ex"><b>'+esc(e.n)+'</b><div class="chips">'+e.s.map(function(s){
        var a=armed===s.id;
        return'<span class="chip'+(a?' arm':'')+'"><bdi dir="ltr">'+s.w+' × '+s.r+'</bdi><button data-act="del" data-id="'+s.id+'" aria-label="حذف">'+(a?'تأكيد الحذف':'×')+'</button></span>';
      }).join('')+'</div></section>';
    }).join('');
  }).join(''):'<p class="empty">لسه ماسجلتش حاجة للعميل ده. املأ الخانات اللي فوق واضغط «سجّل».</p>')
  +'<button class="btn ghost danger" data-act="delc">'+(armed==='c'?'اضغط تاني للتأكيد':'حذف العميل')+'</button></main>';
}

function exp(){
  try{
    var b=new Blob([JSON.stringify(db)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='clients-backup-'+dkey(Date.now())+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
  }catch(e){note='مقدرتش أطلّع النسخة الاحتياطية من المتصفح ده.';paint()}
}
function flash(){var b=$('#sv');if(!b)return;b.textContent='اتسجّل';setTimeout(function(){var x=$('#sv');if(x)x.textContent='سجّل'},900)}

app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,id=b.dataset.id;
  if(a==='toggle'){adding=!adding;paint()}
  else if(a==='open'){view=id;armed=null;draft={ex:'',w:'',r:''};paint();window.scrollTo(0,0)}
  else if(a==='back'){view=null;armed=null;paint()}
  else if(a==='exp')exp();
  else if(a==='imp')$('#imp').click();
  else if(a==='del'){var c=cur();if(armed===id){c.sets=c.sets.filter(function(s){return s.id!==id});armed=null;save()}else armed=id;paint()}
  else if(a==='delc'){if(armed==='c'){db.clients=db.clients.filter(function(x){return x.id!==view});view=null;armed=null;save()}else armed='c';paint()}
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){q=t.value;fillList()}
  else if(view!==null&&(t.id==='ex'||t.id==='w'||t.id==='r'))draft[t.id]=t.value;
});
app.addEventListener('change',function(e){
  if(e.target.id!=='imp'||!e.target.files[0])return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);if(!d||!Array.isArray(d.clients))throw 0;
      d.clients=d.clients.filter(function(c){return c&&c.id&&c.name}).map(function(c){c.sets=Array.isArray(c.sets)?c.sets:[];c.pi=c.pi|0;return c});
      db=d;save();note='اتسترجعت النسخة.';
    }catch(x){note='الملف ده مش نسخة احتياطية صحيحة.'}
    paint();
  };
  r.readAsText(e.target.files[0]);
});
app.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target.dataset.form;
  if(f==='addc'){
    var n=$('#nn').value.trim();if(!n)return;
    var c={id:uid(),name:n,pi:db.clients.length%5,sets:[]};
    db.clients.push(c);save();adding=false;q='';view=c.id;draft={ex:'',w:'',r:''};paint();window.scrollTo(0,0);
  }else if(f==='addset'){
    var c2=cur(),ex=$('#ex').value.trim(),w=parseFloat($('#w').value),r=parseInt($('#r').value,10);
    if(!c2||!ex||isNaN(w)||isNaN(r))return;
    c2.sets.push({id:uid(),ex:ex,w:w,r:r,t:Date.now()});
    save();armed=null;draft={ex:ex,w:String(w),r:String(r)};paint();flash();
  }
});
paint();
</script>
</body>
</html>
